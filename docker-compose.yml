services:
  app:
    build:
      context: ./app/docker
    volumes:
      - ./app:/var/www
    working_dir: /var/www

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www
      - ./app/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
