services:
  app:
    build:
      context: ./app/docker
    volumes:
      - ./app:/var/www
    working_dir: /var/www
    environment:
      REDIS_HOST: redis
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "8081:80"
    volumes:
      - ./app:/var/www
      - ./app/docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      app:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  horizon:
    build:
      context: ./app/docker
    command: php artisan horizon
    volumes:
      - ./app:/var/www
    working_dir: /var/www
    environment:
      REDIS_HOST: redis
      QUEUE_CONNECTION: redis
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_started
